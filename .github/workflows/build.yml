name: Build and Deploy Azure Container App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
      IMAGE_NAME: n8n

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifact
        run: |
          pnpm build:deploy > build.log 2>&1 || {
            tail -n 200 build.log
            exit 1
          }
          tail -n 80 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        env:
          ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
        run: az acr login --name "${ACR_NAME}"

      - name: Build and push custom image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
        run: |
          IMAGE_SHA="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"

          docker build \
            --build-arg N8N_VERSION="${GITHUB_SHA}" \
            -f docker/images/n8n/Dockerfile \
            -t "${IMAGE_SHA}" \
            -t "${IMAGE_LATEST}" \
            .

          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"

      - name: Deploy to Azure Container Apps
        env:
          ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          AZURE_CONTAINER_APP_ENVIRONMENT: ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}
          AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          GENERIC_TIMEZONE: ${{ secrets.GENERIC_TIMEZONE }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_HOST: ${{ secrets.N8N_HOST }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          IMAGE_SHA="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          ACR_USERNAME="$(az acr credential show --name "${ACR_NAME}" --query username -o tsv)"
          ACR_PASSWORD="$(az acr credential show --name "${ACR_NAME}" --query 'passwords[0].value' -o tsv)"

          SECRETS=(
            "db-password=${DB_PASSWORD}"
            "n8n-encryption-key=${N8N_ENCRYPTION_KEY}"
          )

          ENV_VARS=(
            "NODE_ENV=production"
            "N8N_PORT=5678"
            "N8N_HOST=${N8N_HOST}"
            "N8N_PROTOCOL=https"
            "WEBHOOK_URL=${WEBHOOK_URL}"
            "GENERIC_TIMEZONE=${GENERIC_TIMEZONE}"
            "DB_TYPE=postgresdb"
            "DB_POSTGRESDB_HOST=${DB_HOST}"
            "DB_POSTGRESDB_PORT=5432"
            "DB_POSTGRESDB_DATABASE=${DB_DATABASE}"
            "DB_POSTGRESDB_USER=${DB_USER}"
            "DB_POSTGRESDB_PASSWORD=secretref:db-password"
            "N8N_ENCRYPTION_KEY=secretref:n8n-encryption-key"
          )

          if az containerapp show \
            --name "${AZURE_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            >/dev/null 2>&1; then
            az containerapp registry set \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --server "${ACR_LOGIN_SERVER}" \
              --username "${ACR_USERNAME}" \
              --password "${ACR_PASSWORD}"

            az containerapp secret set \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --secrets "${SECRETS[@]}"

            az containerapp update \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${IMAGE_SHA}" \
              --cpu 0.5 \
              --memory 1Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --set-env-vars "${ENV_VARS[@]}"

            az containerapp ingress enable \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --type external \
              --target-port 5678
          else
            az containerapp create \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --environment "${AZURE_CONTAINER_APP_ENVIRONMENT}" \
              --image "${IMAGE_SHA}" \
              --registry-server "${ACR_LOGIN_SERVER}" \
              --registry-username "${ACR_USERNAME}" \
              --registry-password "${ACR_PASSWORD}" \
              --ingress external \
              --target-port 5678 \
              --cpu 0.5 \
              --memory 1Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --secrets "${SECRETS[@]}" \
              --env-vars "${ENV_VARS[@]}"
          fi
